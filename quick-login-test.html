<!DOCTYPE html>
<html>
<head>
    <title>Quick Login Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a1a; 
            color: white; 
            text-align: center;
        }
        button { 
            padding: 15px 30px; 
            margin: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background: #0056b3; }
        .result { 
            margin: 20px 0; 
            padding: 15px; 
            background: #333; 
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <h1>🔐 Quick Login Test</h1>
    <p>Test the exact login credentials that should work:</p>
    
    <button onclick="testLogin()">🚀 Test Login Function</button>
    <button onclick="goToMainLogin()">📱 Go to Main Login</button>
    
    <div id="result" class="result">
        Click "Test Login Function" to verify credentials work
    </div>

    <script>
        function testLogin() {
            const result = document.getElementById('result');
            result.innerHTML = '🔄 Testing login function...';
            
            // Simulate the exact login logic
            const email = 'dagitariku095@gmail.com';
            const password = 'password';
            
            const mockUsers = {
                'dagitariku095@gmail.com': {
                    id: 1,
                    name: 'Demo User',
                    email: 'dagitariku095@gmail.com',
                    role: 'user'
                },
                'admin@tradingdashboard.com': {
                    id: 2,
                    name: 'Admin User',
                    email: 'admin@tradingdashboard.com',
                    role: 'admin'
                }
            };

            console.log('Testing with:', { email, password });
            console.log('Available users:', Object.keys(mockUsers));
            console.log('User found:', mockUsers[email.toLowerCase()]);

            if (mockUsers[email.toLowerCase()]) {
                const user = mockUsers[email.toLowerCase()];
                const mockToken = `mock-token-${user.id}-${Date.now()}`;
                
                // Store in localStorage
                localStorage.setItem('authToken', mockToken);
                localStorage.setItem('userData', JSON.stringify(user));
                localStorage.setItem('loginTime', new Date().toISOString());
                
                result.innerHTML = `✅ LOGIN TEST SUCCESSFUL!
                
User: ${user.name}
Email: ${user.email}
Role: ${user.role}
Token: ${mockToken}

✅ Data stored in localStorage
✅ Ready to access dashboard

<button onclick="goToMainLogin()" style="margin-top: 10px; padding: 10px 20px; background: #28a745; border: none; border-radius: 5px; color: white; cursor: pointer;">Go to Main Login Now</button>`;
            } else {
                result.innerHTML = '❌ Login test failed - user not found';
            }
        }

        function goToMainLogin() {
            window.location.href = '/#/login';
        }

        // Auto-run test on page load
        window.onload = function() {
            console.log('Quick login test page loaded');
        };
    </script>
</body>
</html>
